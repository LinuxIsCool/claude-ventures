<!doctype html>
<html lang="en" class="dark bg-base">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claude-ventures — Legion portfolio</title>
<link rel="stylesheet" href="static/fonts.css" />
<link rel="stylesheet" href="static/tailwind.css" />
<link rel="stylesheet" href="static/legion-ui.css" />
<style>
  body { font-family: "JetBrains Mono", monospace; }
  .input { background:#181825; border:1px solid #45475a; border-radius:4px;
           padding:4px 8px; color:#cdd6f4; font-size:0.8rem; outline:none; }
  .input:focus { border-color:#89b4fa66; }
  .badge { display:inline-flex; align-items:center; padding:1px 6px;
           border:1px solid #45475a; border-radius:4px; color:#bac2de;
           font-size:0.65rem; margin:1px; }
  .nav-link { display:block; padding:3px 8px; border-radius:4px; cursor:pointer;
              font-size:0.8rem; transition:all 0.15s ease; }
  .nav-link:hover { background:#1e1e30; color:#89b4fa; }
  .ui-card { background:#181825; border:1px solid #313244; border-radius:6px;
             padding:10px; transition:transform 0.15s ease, border-color 0.15s ease; }
  .ui-card:hover { transform:translateY(-2px); border-color:#cba6f766; background:#1e1e30; }
  .ui-card.dim { opacity:.34; filter:grayscale(.55); }
  .ui-card.hl  { box-shadow:0 0 0 2px var(--hl,#cba6f7); }
  .ui-card .open-btn { opacity:0; transition:opacity .12s; cursor:pointer; }
  .ui-card:hover .open-btn { opacity:.85; }
  .nav-link.active { background:#1e1e30; color:#cba6f7; }
  .chip { padding:2px 8px; border:1px solid #45475a; border-radius:12px; cursor:pointer;
          font-size:0.7rem; color:#bac2de; transition:all 0.15s ease; }
  .chip:hover { border-color:#89b4fa66; color:#89b4fa; }
  .chip.active { background:#1e1e30; border-color:#cba6f7; color:#cba6f7; }
  .focus-col { background:#181825; border:1px solid #313244; border-radius:6px; padding:10px; }
  .focus-item { cursor:pointer; border-radius:4px; padding:3px 4px; transition:background 0.12s ease; }
  .focus-item:hover { background:#1e1e30; }
  /* Utilities the purged tailwind.css build omits — the focus-rail layout depends on
     these, so define them here to keep the portfolio columns from overlapping. */
  .w-72 { width:18rem; }
  .flex-none { flex:none; }
  .ml-1 { margin-left:0.25rem; }
</style>
</head>
<body class="bg-base text-text font-mono">
  <header class="flex items-center gap-4 p-3 border-b border-overlay">
    <h1 class="font-pixel text-mauve text-sm">claude-ventures</h1>
    <input id="search" class="input flex-1" placeholder="filter ventures…" />
    <span id="healthz-slot" class="badge"></span>
  </header>

  <div class="flex">
    <aside id="page-nav" class="w-48 p-3 border-r border-overlay"></aside>
    <main id="page" class="flex-1 p-3">
      <div id="portfolio-cols" class="flex gap-4 items-start">
        <div class="flex-1 min-w-0">
          <div id="lifecycle-chips" class="flex flex-wrap gap-1 mb-3"></div>
          <div id="grid" class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))"></div>
        </div>
        <aside id="focus-rail" class="w-72 flex-none"></aside>
      </div>
      <div id="placeholder" class="hidden text-subtext text-sm p-6"></div>
    </main>
    <section id="detail" class="w-96 p-3 border-l border-overlay hidden"></section>
  </div>

  <script src="static/embedded-bar.js"></script>
  <script>
    const state = { lifecycle: "all", q: "", view: "portfolio", highlights: new Set(), identity: {}, ventures: [] };
    const VIEWS = ["portfolio", "timeline", "priorities", "trends"];
    const dotColor = p => ({critical:'#f38ba8',high:'#fab387',medium:'#89b4fa',low:'#7f849c'}[p]||'#7f849c');
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function qs() { return new URLSearchParams(location.search); }
    function go(params) {
      const u = new URL(location); u.search = new URLSearchParams(params).toString();
      history.pushState({}, "", u); route();
    }
    function showPage() {
      // Reset page <main> back to the standard layout (detail renderers mutate it).
      document.getElementById("detail").classList.add("hidden");
      const main = document.getElementById("page");
      main.className = "flex-1 p-3";
      main.classList.remove("hidden");
      const vh = document.getElementById("view-host");
      if (vh) vh.remove(); // clear any prior timeline/priorities/trends content
      document.getElementById("page-nav").classList.remove("hidden");
    }
    async function route() {
      const p = qs();
      if (p.get("m")) { return renderMilestone(p.get("v"), p.get("m")); }
      if (p.get("p")) { return renderProject(p.get("p")); }
      if (p.get("v")) { return renderVenture(p.get("v")); }
      const view = VIEWS.includes(p.get("view")) ? p.get("view") : "portfolio";
      state.view = view;
      showPage();
      renderNav();
      if (view === "portfolio") return renderPortfolio();
      if (view === "timeline") return renderTimeline();
      if (view === "priorities") return renderPriorities();
      if (view === "trends") return renderTrends();
    }
    window.onpopstate = route;
    function renderNav() {
      const nav = document.getElementById("page-nav");
      const labels = { portfolio:"Portfolio", timeline:"Timeline", priorities:"Priorities", trends:"Trends" };
      nav.innerHTML = VIEWS.map(v =>
        `<div class="nav-link font-pixel ${state.view===v?"active":""}" data-view="${v}">${labels[v]}</div>`).join("");
      nav.querySelectorAll("[data-view]").forEach(el =>
        el.onclick = () => go({ view: el.dataset.view }));
    }
    async function api(path) {
      const r = await fetch(path);
      if (!r.ok) throw new Error(path + " " + r.status);
      return r.json();
    }
    function lifecycleColor(lc) {
      return { active:"text-green", exploring:"text-blue",
               dormant:"text-subtext", harvesting:"text-yellow" }[lc] || "text-text";
    }
    // ---- identity (emoji + colour) + persistent multi-select highlight filter ----
    const HL_KEY = "ventures.highlights";
    function loadHL() { try { return new Set(JSON.parse(localStorage.getItem(HL_KEY) || "[]")); } catch (e) { return new Set(); } }
    function saveHL() { localStorage.setItem(HL_KEY, JSON.stringify([...state.highlights])); }
    async function loadIdentity() { try { state.identity = await api("static/venture-identity.json"); } catch (e) { state.identity = {}; } }
    function ident(slug) { return state.identity[slug] || {}; }
    function toggleHighlight(slug) {
      state.highlights.has(slug) ? state.highlights.delete(slug) : state.highlights.add(slug);
      saveHL(); renderGrid(); renderFocusRail(); renderStats();
    }
    async function renderStats() {
      const s = await api("api/stats");
      document.getElementById("healthz-slot").textContent =
        `${s.key_metric} active · ${s.overdue_total} overdue`;
      const chips = document.getElementById("lifecycle-chips");
      chips.innerHTML = `<span class="chip ${state.lifecycle==="all"?"active":""}" data-lc="all">All</span>` +
        Object.entries(s.by_lifecycle).map(([lc,n]) =>
          `<span class="chip ${state.lifecycle===lc?"active":""}" data-lc="${esc(lc)}">${esc(lc)} (${esc(n)})</span>`).join("");
      chips.querySelectorAll("[data-lc]").forEach(el =>
        el.onclick = () => { state.lifecycle = el.dataset.lc; renderStats(); renderGrid(); });
      if (state.highlights.size) {
        const c = document.createElement("span");
        c.className = "chip active"; c.style.borderColor = "#cba6f7"; c.style.color = "#cba6f7";
        c.textContent = `★ ${state.highlights.size} highlighted ✕`;
        c.onclick = () => { state.highlights.clear(); saveHL(); renderGrid(); renderFocusRail(); renderStats(); };
        chips.appendChild(c);
      }
    }
    async function renderFocusRail() {
      const rail = document.getElementById("focus-rail");
      let f;
      try { f = await api("api/focus"); }
      catch (e) { rail.innerHTML = ""; return; }
      const cols = [
        { key:"today", label:"Today" },
        { key:"this_week", label:"This Week" },
        { key:"soon", label:"Soon" },
        { key:"attention", label:"Needs attention" },
      ];
      const hl = state.highlights;
      const hlTitles = new Set(state.ventures.filter(v => hl.has(v.slug)).map(v => v.title));
      const keep = it => !hl.size || hl.has(it.venture) || hlTitles.has(it.venture) || hl.has((it.ref || {}).v);
      const colHtml = c => {
        const items = (f[c.key] || []).filter(keep);
        const body = items.length ? items.map((it, i) => `
          <div class="focus-item" data-go='${esc(JSON.stringify(it.ref||{}))}'>
            <div class="flex items-center gap-2 text-xs">
              <span style="display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:${dotColor(it.priority)}"></span>
              <span class="flex-1">${esc(it.title)}</span>
            </div>
            <div class="text-subtext text-xs ml-4">${esc(it.venture)} · ${esc(it.date)}</div>
          </div>`).join("")
          : `<p class="text-subtext text-xs">nothing scheduled</p>`;
        return `<div class="focus-col">
          <div class="font-pixel text-xs text-mauve mb-2">${esc(c.label)}</div>
          <div class="space-y-1">${body}</div>
        </div>`;
      };
      rail.innerHTML = `<div class="grid gap-3 mb-4" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">` +
        cols.map(colHtml).join("") + `</div>`;
      wireGo(rail);
    }
    async function renderPortfolio() {
      document.getElementById("portfolio-cols").classList.remove("hidden");
      document.getElementById("placeholder").classList.add("hidden");
      if (!Object.keys(state.identity).length) await loadIdentity();
      await renderStats();
      // grid first so state.ventures is populated for the focus-rail highlight filter;
      // separate columns mean no vertical reflow / flash regardless of order.
      await renderGrid();
      renderFocusRail();
    }
    function renderStub(label) {
      document.getElementById("portfolio-cols").classList.add("hidden");
      renderStats(); // keep header health-slot fresh
      const ph = document.getElementById("placeholder");
      ph.classList.remove("hidden");
      ph.textContent = label + " — coming in the next build";
    }
    // ---- shared helpers for the view renderers ----
    function viewPage() {
      // Hide the portfolio-only chrome, surface a single content container in #page.
      document.getElementById("portfolio-cols").classList.add("hidden");
      document.getElementById("placeholder").classList.add("hidden");
      renderStats(); // keep header health-slot fresh
      const main = document.getElementById("page");
      let host = document.getElementById("view-host");
      if (!host) {
        host = document.createElement("div");
        host.id = "view-host";
        main.appendChild(host);
      }
      host.innerHTML = "";
      return host;
    }
    function parseDate(s) {
      if (!s) return null;
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
      if (!m) return null;
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return isNaN(d.getTime()) ? null : d;
    }
    function humanize(name) { return String(name).replace(/_/g, " "); }

    // ===================== TIMELINE =====================
    const tlState = { q:"", types:{milestone:true,deadline:true,task:true},
                      priority:"all", status:"all", zoom:"month" };
    let tlData = null;
    const ZOOM = { day:4, week:2, month:1, quarter:0.6 };
    function renderTimeline() {
      const host = viewPage();
      host.innerHTML = `<div id="tl-wrap"></div>`;
      if (tlData) { drawTimeline(); return; }
      api("api/timeline").then(d => { tlData = d; drawTimeline(); })
        .catch(e => { document.getElementById("tl-wrap").innerHTML =
          `<p class="text-subtext text-sm">timeline unavailable</p>`; });
    }
    function tlGlyph(type) {
      return type === "milestone" ? "◆" : type === "deadline" ? "⚑" : "●";
    }
    function drawTimeline() {
      const wrap = document.getElementById("tl-wrap");
      if (!wrap) return;
      const d = tlData || { lanes: [], range: {} };
      const range = d.range || {};
      const minD = parseDate(range.min), maxD = parseDate(range.max);
      const span = (minD && maxD) ? (maxD.getTime() - minD.getTime()) : 0;
      const pct = dt => {
        if (!minD || !maxD || span <= 0) return null;
        return ((dt.getTime() - minD.getTime()) / span) * 100;
      };
      const typeOpts = ["milestone","deadline","task"];
      const prioOpts = ["all","critical","high","medium","low"];
      const statusSet = new Set();
      (d.lanes||[]).forEach(l => (l.items||[]).forEach(it => { if (it.status) statusSet.add(it.status); }));
      const statusOpts = ["all", ...Array.from(statusSet).sort()];

      const controls = `
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <input id="tl-q" class="input" placeholder="search items…" value="${esc(tlState.q)}" />
          ${typeOpts.map(t => `<label class="badge" style="cursor:pointer">
            <input type="checkbox" data-tl-type="${t}" ${tlState.types[t]?"checked":""} style="margin-right:4px"/>${esc(t)}</label>`).join("")}
          <select id="tl-prio" class="input">${prioOpts.map(p=>`<option value="${esc(p)}" ${tlState.priority===p?"selected":""}>${p==="all"?"all priorities":esc(p)}</option>`).join("")}</select>
          <select id="tl-status" class="input">${statusOpts.map(s=>`<option value="${esc(s)}" ${tlState.status===s?"selected":""}>${s==="all"?"all status":esc(s)}</option>`).join("")}</select>
          <span class="text-subtext text-xs ml-2">zoom:</span>
          ${["day","week","month","quarter"].map(z=>`<span class="chip ${tlState.zoom===z?"active":""}" data-tl-zoom="${z}">${z}</span>`).join("")}
        </div>`;

      if (!minD || !maxD || span <= 0) {
        wrap.innerHTML = controls + `<p class="text-subtext text-sm">nothing on the timeline yet</p>`;
        wireTimelineControls();
        return;
      }

      const q = tlState.q.toLowerCase();
      const keep = it =>
        tlState.types[it.type] &&
        (tlState.priority === "all" || (it.priority||"") === tlState.priority) &&
        (tlState.status === "all" || (it.status||"") === tlState.status) &&
        (!q || String(it.title||"").toLowerCase().includes(q));

      const trackWidth = Math.round(100 * (ZOOM[tlState.zoom] || 1));
      const today = new Date(); today.setHours(0,0,0,0);
      const todayPct = pct(today);
      const nowLine = (todayPct != null && todayPct >= 0 && todayPct <= 100)
        ? `<div title="today" style="position:absolute;top:0;bottom:0;left:${todayPct}%;width:1px;background:#cba6f766;z-index:1"></div>` : "";

      const lanesHtml = (d.lanes||[]).map(lane => {
        const items = (lane.items||[]).filter(it => parseDate(it.date) && keep(it));
        const marks = items.map(it => {
          const x = pct(parseDate(it.date));
          const color = dotColor(it.priority);
          const tip = esc(it.title) + " · " + esc(it.date) + " · " + esc(it.status||"");
          const ref = (it.type === "milestone" && it.id)
            ? { v: lane.venture, m: it.id } : { v: lane.venture };
          return `<span class="tl-mark" title="${tip}" data-go='${esc(JSON.stringify(ref))}'
            style="position:absolute;left:${x}%;top:50%;transform:translate(-50%,-50%);color:${color};
            font-size:0.8rem;line-height:1;cursor:pointer;z-index:2">${tlGlyph(it.type)}</span>`;
        }).join("");
        return `<div class="flex items-stretch gap-2 mb-1">
          <div class="text-xs" style="width:160px;flex:none">
            <a href="#" class="nav-link" style="padding:6px 8px" data-go='${esc(JSON.stringify({v:lane.venture}))}'>${esc(lane.title||lane.venture)}</a>
          </div>
          <div style="flex:1;overflow-x:auto">
            <div style="position:relative;height:32px;width:${trackWidth}%;min-width:100%;
              border-bottom:1px solid #313244;background:#181825;border-radius:4px">
              ${nowLine}${marks}
            </div>
          </div>
        </div>`;
      }).join("");

      const legend = `<div class="text-subtext text-xs mt-3">
        <span style="color:#cdd6f4">◆</span> milestone &nbsp;
        <span style="color:#cdd6f4">⚑</span> deadline &nbsp;
        <span style="color:#cdd6f4">●</span> task &nbsp;·&nbsp;
        range ${esc(range.min)} → ${esc(range.max)}</div>`;

      wrap.innerHTML = controls + (lanesHtml || `<p class="text-subtext text-sm">no items match the filters</p>`) + legend;
      wireTimelineControls();
      wireGo(wrap);
    }
    function wireTimelineControls() {
      const wrap = document.getElementById("tl-wrap");
      if (!wrap) return;
      const qel = wrap.querySelector("#tl-q");
      if (qel) qel.oninput = e => { tlState.q = e.target.value; drawTimeline(); requeryFocus(); };
      wrap.querySelectorAll("[data-tl-type]").forEach(el =>
        el.onchange = () => { tlState.types[el.dataset.tlType] = el.checked; drawTimeline(); });
      const prio = wrap.querySelector("#tl-prio");
      if (prio) prio.onchange = () => { tlState.priority = prio.value; drawTimeline(); };
      const st = wrap.querySelector("#tl-status");
      if (st) st.onchange = () => { tlState.status = st.value; drawTimeline(); };
      wrap.querySelectorAll("[data-tl-zoom]").forEach(el =>
        el.onclick = () => { tlState.zoom = el.dataset.tlZoom; drawTimeline(); });
    }
    function requeryFocus() {
      // keep search-box focus across drawTimeline re-renders
      const qel = document.querySelector("#tl-q");
      if (qel) { qel.focus(); const v = qel.value; qel.setSelectionRange(v.length, v.length); }
    }

    // ===================== PRIORITIES =====================
    async function renderPriorities() {
      const host = viewPage();
      let d;
      try { d = await api("api/priorities"); }
      catch (e) { host.innerHTML = `<p class="text-subtext text-sm">priorities unavailable</p>`; return; }
      const items = d.items || [];
      if (!items.length) { host.innerHTML = `<p class="text-subtext text-sm">no priorities</p>`; return; }
      const row = it => {
        const sp = it.score_parts || {};
        const tip = `urgency ${sp.urgency||0} · manual ${sp.manual||0} · stage ${sp.stage||0} · financial ${sp.financial||0}`;
        return `<div class="ui-card" style="cursor:pointer" data-go='${esc(JSON.stringify(it.ref||{}))}'>
          <div class="flex items-center gap-2">
            <span class="badge" title="${esc(tip)}" style="border-color:${dotColor(it.priority)};color:${dotColor(it.priority)}">${esc(it.score)}</span>
            <span class="flex-1 text-xs">${esc(it.title)}</span>
            <span class="badge">${esc(it.kind)}</span>
          </div>
          <div class="text-subtext text-xs mt-1 ml-1">
            <a href="#" class="text-blue" data-go='${esc(JSON.stringify({v:it.venture}))}'>${esc(it.venture)}</a>
            ${it.due ? ` · due ${esc(it.due)}` : ""}
          </div>
        </div>`;
      };
      const top = items.slice(0, 5);
      host.innerHTML = `
        <h2 class="font-pixel text-xs text-mauve mb-2">Top 5</h2>
        <div class="grid gap-2 mb-5" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${top.map(row).join("")}</div>
        <h2 class="font-pixel text-xs text-green mb-2">All priorities (${items.length})</h2>
        <div class="grid gap-2" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${items.map(row).join("")}</div>`;
      wireGo(host);
    }

    // ===================== TRENDS =====================
    function lineChart(points, opts) {
      opts = opts || {};
      const W = opts.width || 320, H = opts.height || 120, color = opts.color || "#89b4fa";
      const label = esc(opts.label || "");
      const padL = 6, padR = 6, padT = 10, padB = 14;
      const iw = W - padL - padR, ih = H - padT - padB;
      const pts = (points || []).filter(p => typeof p.value === "number" && isFinite(p.value));
      const baseline = `<line x1="${padL}" y1="${padT+ih}" x2="${padL+iw}" y2="${padT+ih}" stroke="#45475a" stroke-width="1"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+ih}" stroke="#45475a" stroke-width="1"/>`;
      const head = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#181825;border-radius:4px">`;
      const title = `<text x="${padL}" y="9" fill="#bac2de" font-size="9" font-family="monospace">${label}</text>`;
      if (pts.length === 0) {
        return head + baseline + title + `<text x="${padL+4}" y="${padT+ih/2}" fill="#7f849c" font-size="9" font-family="monospace">no data</text></svg>`;
      }
      let vmin = Infinity, vmax = -Infinity;
      pts.forEach(p => { if (p.value < vmin) vmin = p.value; if (p.value > vmax) vmax = p.value; });
      const range = (vmax - vmin) || 1;
      const n = pts.length;
      const xOf = i => padL + (n === 1 ? iw/2 : (i/(n-1))*iw);
      const yOf = v => padT + ih - ((v - vmin)/range)*ih;
      const last = pts[n-1];
      let body;
      if (n === 1) {
        body = `<circle cx="${xOf(0)}" cy="${yOf(pts[0].value)}" r="3" fill="${color}"/>`;
      } else {
        const poly = pts.map((p,i) => `${xOf(i).toFixed(1)},${yOf(p.value).toFixed(1)}`).join(" ");
        body = `<polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.5"/>
          <circle cx="${xOf(n-1)}" cy="${yOf(last.value)}" r="2.5" fill="${color}"/>`;
      }
      const lastTxt = esc(String(last.value));
      const lx = Math.min(xOf(n-1), W - padR - lastTxt.length*5.2);
      const lbl = `<text x="${Math.max(padL, lx)}" y="${Math.max(padT+7, yOf(last.value)-4)}" fill="${color}" font-size="9" font-family="monospace">${lastTxt}</text>`;
      return head + baseline + title + body + lbl + `</svg>`;
    }
    async function renderTrends() {
      const host = viewPage();
      let d;
      try { d = await api("api/trends"); }
      catch (e) { host.innerHTML = `<p class="text-subtext text-sm">trends unavailable</p>`; return; }
      const series = d.series || {};
      const derivable = new Set(d.derivable || []);
      const snapshot = new Set(d.snapshot_based || []);

      const card = name => {
        const pts = series[name] || [];
        // ventures_by_stage (and any dict-valued series): render as a stage legend, not a chart.
        if (pts.length && pts[0].value && typeof pts[0].value === "object") {
          const latest = pts[pts.length-1];
          const legend = Object.entries(latest.value || {})
            .map(([k,v]) => `<span class="badge">${esc(k)}: ${esc(v)}</span>`).join(" ")
            || `<span class="text-subtext text-xs">no data</span>`;
          return `<div class="ui-card">
            <div class="text-xs text-text mb-2">${esc(humanize(name))}</div>
            <div>${legend}</div>
            <div class="text-subtext text-xs mt-2">latest snapshot ${esc(latest.date||"")}</div>
          </div>`;
        }
        const svg = lineChart(pts, { label: humanize(name) });
        let note = "";
        if (pts.length === 0) note = `<div class="text-subtext text-xs mt-1">no data yet</div>`;
        else if (pts.length < 2) note = `<div class="text-subtext text-xs mt-1">data starts ${esc(pts[0].date||"")}</div>`;
        return `<div class="ui-card">${svg}${note}</div>`;
      };

      const group = (title, names) => {
        const present = names.filter(n => n in series);
        if (!present.length) return "";
        return `<h2 class="font-pixel text-xs text-mauve mb-2 mt-1">${esc(title)}</h2>
          <div class="grid gap-3 mb-5" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">
            ${present.map(card).join("")}</div>`;
      };
      // any series not classified falls into a misc group
      const classified = new Set([...derivable, ...snapshot]);
      const misc = Object.keys(series).filter(n => !classified.has(n));
      host.innerHTML =
        group("Derived from current data", [...derivable]) +
        group("Tracked over time", [...snapshot]) +
        (misc.length ? group("Other", misc) : "") ||
        `<p class="text-subtext text-sm">no trend data yet</p>`;
    }
    async function renderGrid() {
      let items = await api("api/list");
      state.ventures = items;
      if (state.lifecycle !== "all") items = items.filter(i => i.lifecycle === state.lifecycle);
      if (state.q) items = items.filter(i => i.title.toLowerCase().includes(state.q));
      const anyHL = state.highlights.size > 0;
      document.getElementById("grid").innerHTML = items.map(i => {
        const id = ident(i.slug), col = id.colour || "#9399b2";
        const cls = state.highlights.has(i.slug) ? "hl" : (anyHL ? "dim" : "");
        return `
        <div class="ui-card cursor-pointer ${cls}" data-slug="${esc(i.slug)}" style="border-left:4px solid ${col};--hl:${col}">
          <div class="flex items-start gap-2">
            <span class="text-sm leading-none">${id.emoji || ""}</span>
            <div class="flex-1 min-w-0">
              <div class="font-pixel text-xs truncate" style="color:${col}">${esc(i.title)}</div>
              <div class="text-subtext text-xs mt-1">${esc(i.stage)} · ${esc(i.priority)}</div>
            </div>
            <span class="open-btn text-xs text-subtext" data-open="${esc(i.slug)}" title="open full">↗</span>
          </div>
          ${i.overdue_count ? `<div class="badge bg-red/20 text-red mt-1">${esc(i.overdue_count)} overdue</div>` : ""}
        </div>`; }).join("");
      const grid = document.getElementById("grid");
      grid.querySelectorAll(".ui-card").forEach(el => el.onclick = (e) => {
        if (e.target.closest("[data-open]")) return;     // click = toggle highlight (filter), not navigate
        toggleHighlight(el.dataset.slug);
      });
      grid.querySelectorAll("[data-open]").forEach(el => el.onclick = (e) => {
        e.stopPropagation(); go({ v: el.dataset.open });  // ↗ opens the full venture page
      });
    }
    function backBar(crumbs) {
      return `<div class="mb-4 text-xs text-subtext">` +
        crumbs.map(c => c.href !== undefined
          ? `<a href="#" class="text-blue" data-go='${esc(JSON.stringify(c.href))}'>${esc(c.label)}</a>`
          : esc(c.label)).join(" › ") + `</div>`;
    }
    function wireGo(scope) {
      scope.querySelectorAll("[data-go]").forEach(el =>
        el.onclick = e => { e.preventDefault(); go(JSON.parse(el.dataset.go)); });
    }
    function taskList(tasks) {
      if (!tasks || !tasks.length) return `<p class="text-subtext text-xs">no linked tasks yet</p>`;
      const dot = p => ({critical:'#f38ba8',high:'#fab387',medium:'#89b4fa',low:'#7f849c'}[p]||'#7f849c');
      return `<div class="space-y-1">` + tasks.map(t=>`
        <div class="flex items-center gap-2 text-xs">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dot(t.priority)}"></span>
          <span class="text-subtext">#${esc(t.id)}</span>
          <span class="flex-1">${esc(t.title)}</span>
          <span class="badge">${esc(t.status)}</span>
          ${t.due?`<span class="text-subtext">${esc(t.due)}</span>`:""}
        </div>`).join("") + `</div>`;
    }
    function enterDetail() {
      document.getElementById("page").classList.add("hidden");
      // Keep the left nav mounted. Hiding it meant drilling into any venture
      // stranded you with no way to reach Timeline / Priorities / Trends
      // except the browser back button.
      document.getElementById("page-nav").classList.remove("hidden");
      renderNav();
      const d = document.getElementById("detail");
      d.className = "flex-1 p-4"; d.classList.remove("hidden"); return d;
    }
    // ============ MANIFEST-DRIVEN VENTURE DETAIL ============
    // The bands, their order, and the exact paths each one reads are declared
    // in web/venture_bands.json and served at api/bands. The same file is what
    // ventures_contract.py checks against the store in both directions, so a
    // field cannot be "declared but unrendered" or "rendered but unwritten".
    // Removing a path from a generic band's `reads` removes it from the page.
    let bandsManifest = null;

    // Resolve a declared path ("financial.invoices[].id", "co_venturers[].name")
    // against a record. Returns {scalar} for plain paths or {rows} for [] paths.
    function resolvePath(obj, path) {
      const parts = path.split(".");
      let cur = obj;
      for (let i = 0; i < parts.length; i++) {
        let key = parts[i], isArr = key.endsWith("[]");
        if (isArr) key = key.slice(0, -2);
        if (cur == null) return undefined;
        cur = key ? cur[key] : cur;
        if (isArr) {
          if (!Array.isArray(cur)) return undefined;
          const rest = parts.slice(i + 1).join(".");
          if (!rest) return cur;
          return cur.map(item => resolvePath(item, rest));
        }
      }
      return cur;
    }
    function pathLabel(path) {
      const last = path.split(".").pop().replace(/\[\]$/, "");
      return last.replace(/_/g, " ");
    }
    function scalarHtml(val) {
      if (val == null || val === "") return "";
      if (typeof val === "object") {
        // Never render "[object Object]". Structured values are shown as their
        // own nested rows so a nested block is legible instead of dropped.
        const entries = Array.isArray(val)
          ? val.map((x, i) => [String(i), x]) : Object.entries(val);
        if (!entries.length) return `<span class="text-subtext">empty</span>`;
        return `<span class="text-subtext">{</span>` + entries.map(([k, x]) =>
          `<span class="ml-1">${esc(k)}: ${typeof x === "object" && x !== null
            ? `<span class="text-subtext">…${Array.isArray(x)?x.length+" items":Object.keys(x).length+" keys"}</span>`
            : esc(x)}</span>`).join(`<span class="text-subtext">,</span>`)
          + `<span class="text-subtext">}</span>`;
      }
      const s = String(val);
      return /^https?:/.test(s)
        ? `<a class="text-blue" href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`
        : esc(s);
    }
    function kvRows(pairs) {
      return pairs.map(([k, val]) =>
        `<div class="text-xs"><span class="text-subtext">${esc(k)}:</span> ${scalarHtml(val)}</div>`
      ).join("");
    }
    // Keys a band claims via `tail: "prefix.*"` but did not name explicitly.
    function tailPairs(v, band) {
      if (!band.tail || band.tail === "*") return [];
      const root = band.tail.slice(0, -2); // "financial.*" -> "financial"
      const obj = v[root];
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) return [];
      const named = new Set((band.reads || [])
        .filter(p => p.startsWith(root + "."))
        .map(p => p.slice(root.length + 1).split(".")[0].replace(/\[\]$/, "")));
      return Object.entries(obj).filter(([k]) => !named.has(k));
    }
    // Everything no band claimed. Rendered so nothing is dropped; also reported
    // as `uncategorized` by the contract so it stays visible as drift.
    function catchAllPairs(v, manifest) {
      const claimed = new Set(Object.keys(manifest.ignored || {}));
      claimed.add("slug"); claimed.add("lifecycle"); claimed.add("error");
      claimed.add("projects"); claimed.add("tasks"); claimed.add("overdue_count");
      claimed.add("record_fields");  // payload metadata, not a venture field
      for (const b of manifest.bands) {
        if (b.tail === "*") continue;
        for (const p of (b.reads || [])) claimed.add(p.split(".")[0].replace(/\[\]$/, ""));
        if (b.tail) claimed.add(b.tail.slice(0, -2));
      }
      return Object.entries(v).filter(([k]) => !claimed.has(k));
    }

    const GENERIC = {
      kv(v, band) {
        const named = (band.reads || [])
          .map(p => [pathLabel(p), resolvePath(v, p)])
          .filter(([, val]) => val !== undefined && val !== null && val !== "");
        const pairs = named.concat(tailPairs(v, band));
        return pairs.length ? kvRows(pairs) : null;
      },
      table(v, band) {
        const root = (band.reads || [])[0];
        if (!root) return null;
        const arrKey = root.split("[]")[0];
        const rows = v[arrKey];
        if (!Array.isArray(rows) || !rows.length) return null;
        const cols = band.columns
          || Array.from(new Set((band.reads || []).map(p => p.split("[].")[1]).filter(Boolean)));
        const head = cols.map(c => `<th class="text-left pr-3 text-subtext font-normal">${esc(c)}</th>`).join("");
        const body = rows.map(r => {
          const extra = Object.entries(r).filter(([k]) => !cols.includes(k));
          const cells = cols.map(c => `<td class="pr-3 align-top">${scalarHtml(r[c])}</td>`).join("");
          const note = extra.length
            ? `<tr><td colspan="${cols.length}" class="text-subtext pb-2 pl-2">${kvRows(extra)}</td></tr>` : "";
          return `<tr>${cells}</tr>${note}`;
        }).join("");
        return `<table class="text-xs w-full"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
      },
      chips(v, band) {
        // Reads over the same array must produce ONE chip per element, not one
        // chip per field: `co_venturers[].name` + `co_venturers[].role` is a
        // person, not seven names followed by seven roles.
        const groups = new Map();   // array root -> [sub-field, ...]
        const plain = [];
        for (const p of (band.reads || [])) {
          const i = p.indexOf("[].");
          if (i > -1) {
            const root = p.slice(0, i), sub = p.slice(i + 3);
            if (!groups.has(root)) groups.set(root, []);
            groups.get(root).push(sub);
          } else {
            plain.push(p);
          }
        }
        const out = [];
        for (const [root, subs] of groups) {
          const arr = v[root];
          if (!Array.isArray(arr)) continue;
          for (const item of arr) {
            if (item == null) continue;
            if (typeof item !== "object") { out.push(String(item)); continue; }
            const parts = subs
              .map(s => resolvePath(item, s))
              .filter(x => x != null && x !== "" && typeof x !== "object")
              .map(String);
            if (parts.length) out.push(parts.join(" — "));
          }
        }
        for (const p of plain) {
          const val = resolvePath(v, p);
          if (val == null) continue;
          for (const item of (Array.isArray(val) ? val : [val])) {
            if (item == null || item === "") continue;
            out.push(typeof item === "object"
              ? Object.values(item).filter(x => x != null && typeof x !== "object").join(" — ")
              : String(item));
          }
        }
        const uniq = Array.from(new Set(out.filter(Boolean)));
        return uniq.length ? uniq.map(t => `<span class="badge">${esc(t)}</span>`).join(" ") : null;
      },
    };

    // Bands whose rendering is bespoke. Their `reads` are declared but NOT
    // enforced by rendering; ventures_contract reports them as non-load-bearing
    // so the honest amount of enforcement is always visible.
    const CUSTOM_BANDS = {
      identity(v) {
        const tags = (v.tags || []).map(t => `<span class="badge">${esc(t)}</span>`).join(" ");
        return `<h1 class="font-pixel text-mauve text-sm mb-1">${esc(v.title)}</h1>
          <div class="text-subtext text-xs mb-2">${esc(v.stage)} · ${esc(v.priority)}${
            v.type ? " · " + esc(v.type) : ""}${
            v.started_at ? " · started " + esc(String(v.started_at).slice(0,10)) : ""}</div>
          <p class="text-xs mb-2">${esc(v.description || "")}</p>
          ${tags ? `<div class="mb-2">${tags}</div>` : ""}
          ${v.notes ? `<p class="text-xs text-subtext whitespace-pre-wrap mb-2">${esc(v.notes)}</p>` : ""}`;
      },
      milestones(v) {
        const ms = v.milestones || [];
        if (!ms.length) return null;
        return ms.map(m => {
          const done = m.completed || ["done","complete","completed"].includes(String(m.status||"").toLowerCase());
          const when = m.date || m.completed_at || m.completed_date || (m.deadline && m.deadline.date) || m.date_window || "";
          const deliv = (m.deliverables || []).map(x => `<li>${scalarHtml(x)}</li>`).join("");
          return `<div class="mb-2">
            <div class="text-xs ${done ? "line-through text-subtext" : ""}">
              <a href="#" class="text-blue" data-go='${esc(JSON.stringify({v:v.slug,m:m.id}))}'>${esc(m.title||m.id)}</a>
              <span class="badge ml-1">${esc(m.status||"")}</span>
              ${when ? `<span class="text-subtext ml-1">${esc(when)}</span>` : ""}
              ${m.owner ? `<span class="text-subtext ml-1">· ${esc(m.owner)}</span>` : ""}
            </div>
            ${deliv ? `<ul class="text-xs text-subtext ml-4 list-disc">${deliv}</ul>` : ""}
            ${m.notes ? `<div class="text-xs text-subtext ml-4 whitespace-pre-wrap">${esc(m.notes)}</div>` : ""}
          </div>`;
        }).join("");
      },
      projects(v) {
        const ps = v.projects || [];
        if (!ps.length) return null;
        return ps.map(p => {
          const mss = (p.milestones || []).map(m =>
            `<div class="text-xs ml-4 ${m.done ? "line-through text-subtext" : ""}">
               ${esc(m.title)}${m.deadline ? `<span class="text-subtext ml-1">${esc(m.deadline)}</span>` : ""}
               ${m.stage ? `<span class="badge ml-1">${esc(m.stage)}</span>` : ""}</div>`).join("");
          return `<div class="mb-2">
            <div class="text-xs">
              <a href="#" class="text-blue" data-go='${esc(JSON.stringify({v:v.slug,p:p.slug}))}'>${esc(p.name||p.slug)}</a>
              ${p.stage ? `<span class="badge ml-1">${esc(p.stage)}</span>` : ""}
              ${p.priority ? `<span class="badge">${esc(p.priority)}</span>` : ""}
              ${p.owner ? `<span class="text-subtext ml-1">${esc(p.owner)}</span>` : ""}
            </div>
            ${p.objective ? `<div class="text-xs text-subtext ml-4">${esc(p.objective)}</div>` : ""}
            ${mss}</div>`;
        }).join("");
      },
      tasks(v) {
        const ts = v.tasks || [];
        if (!ts.length) return null;
        const open = ts.filter(t => !["done","complete","completed","closed","cancelled"]
          .includes(String(t.status||"").toLowerCase()));
        const closed = ts.filter(t => !open.includes(t));
        return taskList(open) + (closed.length
          ? `<details class="mt-2"><summary class="text-subtext text-xs cursor-pointer">${closed.length} closed</summary>
             <div class="mt-1">${taskList(closed)}</div></details>` : "");
      },
      financial(v, band) {
        const f = v.financial;
        if (!f || !Object.keys(f).length) return null;
        const money = m => (m && typeof m === "object" && m.amount != null)
          ? `${esc(m.amount)} ${esc(m.currency || "")}` : scalarHtml(m);
        const totals = [
          ["invoiced", f.total_invoiced], ["received", f.total_received],
          ["outstanding", f.outstanding],
          ["bank confirmed", f.received_bank_confirmed],
          ["client asserted (unverified)", f.received_client_asserted_unverified],
        ].filter(([, m]) => m != null);
        const totalsHtml = totals.length ? `<div class="mb-2">` + totals.map(([k, m]) =>
          `<div class="text-xs"><span class="text-subtext">${esc(k)}:</span> ${money(m)}</div>`).join("") + `</div>` : "";
        const invs = f.invoices || [];
        const invHtml = invs.length ? `<table class="text-xs w-full mb-2"><thead><tr>
            ${["id","amount","issued","due","status"].map(c=>`<th class="text-left pr-3 text-subtext font-normal">${esc(c)}</th>`).join("")}
          </tr></thead><tbody>` + invs.map(i => `<tr>
            <td class="pr-3">${i.pdf ? `<span title="${esc(i.pdf)}">${esc(i.id)}</span>` : esc(i.id)}</td>
            <td class="pr-3">${esc(i.amount)} ${esc(i.currency||"")}</td>
            <td class="pr-3 text-subtext">${esc(i.issued ? String(i.issued).slice(0,10) : "")}</td>
            <td class="pr-3 text-subtext">${esc(i.due ? String(i.due).slice(0,10) : "")}</td>
            <td class="pr-3"><span class="badge">${esc(i.status||"")}</span></td>
          </tr>${i.description ? `<tr><td colspan="5" class="text-subtext pb-1">${esc(i.description)}</td></tr>` : ""}`).join("")
          + `</tbody></table>` : "";
        // Anything the totals block or the invoice table already showed must
        // not be repeated by the tail.
        const shown = new Set(["invoices", "total_invoiced", "total_received",
          "outstanding", "received_bank_confirmed", "received_client_asserted_unverified"]);
        const rest = tailPairs(v, band).filter(([k]) => !shown.has(k));
        return totalsHtml + invHtml + (rest.length ? kvRows(rest) : "");
      },
    };

    function emptyState(band, v, staleBackend) {
      // A stale backend cannot tell us what the file had, so refuse to make a
      // claim about the record. Saying nothing true is better than saying
      // something false.
      if (staleBackend) {
        return `<p class="text-subtext text-xs">not sent by this server (older backend)</p>`;
      }
      // Typed, never a bare "none": a wrong join and a genuinely empty venture
      // must not look the same. That confusion is what hid `Projects: none`
      // while six projects existed.
      //
      // `record_fields` is what the FILE had, not what the payload defaulted.
      // Testing v[key] !== undefined would call every venture's `deadlines`
      // "present but empty", because the accessor defaults it to [].
      const JOIN_BANDS = {
        projects: "no project files found under this venture's projects/ tree, and none in project-mirror/",
        tasks: "no backlog tasks link to this venture, by venture: field or parent_id",
      };
      if (JOIN_BANDS[band.key]) {
        return `<p class="text-subtext text-xs">${JOIN_BANDS[band.key]}</p>`;
      }
      const root = (band.reads || [])[0];
      const key = band.tail && band.tail !== "*" ? band.tail.slice(0, -2)
                : root ? root.split(".")[0].replace(/\[\]$/, "") : band.key;
      const inRecord = (v.record_fields || []).includes(key);
      const msg = inRecord
        ? `<code>${esc(key)}</code> is in this record but empty`
        : `no <code>${esc(key)}</code> in this venture's record`;
      return `<p class="text-subtext text-xs">${msg}</p>`;
    }

    function renderBand(v, band, manifest, staleBackend) {
      // Per-band isolation: one band throwing must not take the page down.
      // Before this, any error anywhere 500'd the whole detail request.
      let html;
      try {
        if (band.tail === "*") {
          const pairs = catchAllPairs(v, manifest);
          html = pairs.length ? kvRows(pairs) : null;
        } else if (band.renderer === "custom") {
          html = (CUSTOM_BANDS[band.key] || (() => null))(v, band);
        } else {
          switch (band.renderer) {
            case "kv":    html = GENERIC.kv(v, band); break;
            case "table": html = GENERIC.table(v, band); break;
            case "chips": html = GENERIC.chips(v, band); break;
            default:      html = null;
          }
        }
      } catch (e) {
        return `<h2 class="font-pixel text-xs text-red mt-4 mb-2">${esc(band.title || band.key)}</h2>
                <p class="text-xs text-red">this band failed to render: ${esc(e.message || e)}</p>`;
      }
      const heading = band.title
        ? `<h2 class="font-pixel text-xs text-green mt-4 mb-2">${esc(band.title)}</h2>` : "";
      return heading + (html || emptyState(band, v, staleBackend));
    }

    // The manifest is a STATIC file, not an API route. Both it and this page
    // are read from disk per request, so they can never disagree about which
    // version they are. Fetching it from /api/ made the page depend on the
    // backend's process age, and a server started before the endpoint existed
    // served this frontend a 404 and rendered a blank page.
    async function loadManifest() {
      if (bandsManifest) return bandsManifest;
      const r = await fetch("static/venture_bands.json");
      if (!r.ok) throw new Error("static/venture_bands.json " + r.status);
      return (bandsManifest = await r.json());
    }

    async function renderVenture(slug) {
      const d = enterDetail();   // enter the view FIRST: a failure below must
                                 // still leave the user somewhere navigable
      let v, manifest;
      try {
        [v, manifest] = await Promise.all([
          api("api/venture/" + encodeURIComponent(slug)),
          loadManifest(),
        ]);
      } catch (e) {
        d.innerHTML = backBar([{label:"← Portfolio",href:{}}]) +
          `<p class="text-xs text-red">This page could not load: ${esc(e.message||e)}</p>
           <p class="text-xs text-subtext mt-2">If this names a missing endpoint or file,
           the server is running older code than the page. Restart the webui.</p>`;
        wireGo(d); return;
      }
      if (v.error) {
        d.innerHTML = backBar([{label:"← Portfolio",href:{}}]) + `<p class="text-xs">Venture not found.</p>`;
        wireGo(d); return;
      }
      // `record_fields` is sent by every backend that can also send the full
      // record. Its absence means the server predates that change, so sections
      // will render empty for fields the venture actually HAS. Without this
      // banner the page would state "no deadlines in this venture's record"
      // about a record holding eight -- the precise confusion between "absent"
      // and "not delivered" that this page was rebuilt to eliminate.
      const staleBackend = v.record_fields === undefined;
      const staleBanner = staleBackend
        ? `<div class="text-xs text-yellow" style="border:1px solid #f9e2af55;border-radius:4px;padding:6px 8px;margin-bottom:10px">
             This server is running older code than this page, so it is not sending the full
             venture record. Sections below may read as empty for fields this venture does have.
             Restart the webui to see the real values.
           </div>` : "";
      d.innerHTML = backBar([{label:"← Portfolio",href:{}},{label:v.title}]) + staleBanner
        + manifest.bands.map(b => renderBand(v, b, manifest, staleBackend)).join("");
      wireGo(d);
    }
    async function renderProject(slug) {
      const p = await api("api/project/" + encodeURIComponent(slug));
      const d = enterDetail();
      if (p.error) { d.innerHTML = backBar([{label:"← Portfolio",href:{}}]) + `<p class="text-xs">Project not found.</p>`; wireGo(d); return; }
      d.innerHTML = backBar([{label:"← Portfolio",href:{}},{label:p.venture},{label:p.slug}]) + `
        <h1 class="font-pixel text-mauve text-sm mb-1">${esc(p.slug)}</h1>
        <div class="text-subtext text-xs mb-3">venture: ${esc(p.venture)}</div>
        <p class="text-xs mb-4">${esc(p.objective||"")}</p>
        <h2 class="font-pixel text-xs text-green mt-4 mb-2">Milestones</h2>
        ${(p.milestones||[]).map(m=>`<div class="text-xs mb-1 ${m.done?'line-through text-subtext':''}">${esc(m.title)}</div>`).join("")||`<p class="text-subtext text-xs">none</p>`}
        <h2 class="font-pixel text-xs text-green mt-4 mb-2">Tasks</h2>${taskList(p.tasks)}`;
      wireGo(d);
    }
    async function renderMilestone(v, m) {
      const ms = await api("api/milestone/" + encodeURIComponent(v) + "/" + encodeURIComponent(m));
      const d = enterDetail();
      if (ms.error) { d.innerHTML = backBar([{label:"← Portfolio",href:{}}]) + `<p class="text-xs">Milestone not found.</p>`; wireGo(d); return; }
      d.innerHTML = backBar([{label:"← Portfolio",href:{}},{label:ms.venture_title||v,href:{v:v}},{label:ms.title||m}]) + `
        <h1 class="font-pixel text-mauve text-sm mb-1">${esc(ms.title||m)}</h1>
        <div class="text-subtext text-xs mb-3">${esc(ms.status||"")}</div>
        <h2 class="font-pixel text-xs text-green mt-4 mb-2">Deliverables</h2>
        ${(ms.deliverables||[]).map(x=>`<div class="text-xs">• ${esc(x)}</div>`).join("")||`<p class="text-subtext text-xs">none</p>`}
        ${ms.notes?`<h2 class="font-pixel text-xs text-green mt-4 mb-2">Notes</h2><p class="text-xs whitespace-pre-wrap">${esc(ms.notes)}</p>`:""}
        <h2 class="font-pixel text-xs text-green mt-4 mb-2">Tasks</h2>${taskList(ms.tasks)}`;
      wireGo(d);
    }
    document.getElementById("search").oninput = (e) => { state.q = e.target.value.toLowerCase(); renderGrid(); };
    state.highlights = loadHL();
    route();
  </script>
</body>
</html>
