<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIE Workspace</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text x='50%' y='52' font-size='52' text-anchor='middle'>%F0%9F%97%82%EF%B8%8F</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: {
          pixel: ['"Press Start 2P"', 'monospace'],
          mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
        },
        colors: {
          surface: { DEFAULT: '#0f0f17', card: '#161622', border: '#2a2a3e', raised: '#1e1e30' },
          accent: { green: '#a6e3a1', blue: '#89b4fa', red: '#f38ba8', yellow: '#f9e2af', purple: '#cba6f7', pink: '#f5c2e7', teal: '#94e2d5' },
        },
        animation: { 'fade-in': 'fade-in 0.2s ease-out' },
        keyframes: { 'fade-in': { from: { opacity: 0, transform: 'translateY(5px)' }, to: { opacity: 1, transform: 'translateY(0)' } } },
      } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #0f0f17; color: #cdd6f4; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #0f0f17; }
    ::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 4px; }
    button, input, select, a { transition: all .15s ease; }
    .nav-tab:hover { transform: translateY(-1px); border-color: #89b4fa66; color: #89b4fa; }
    .nav-tab.active { border-color: #a6e3a166; color: #a6e3a1; background: #a6e3a111; }
    .card-row { transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    .card-row:hover { transform: translateX(3px); background: #1e1e30; border-color: #89b4fa55; }
    .card-row.selected { background: #a6e3a10d; border-color: #a6e3a166; }
    .thumb { background: radial-gradient(circle at 30% 20%, #2a2a3e, #161622 55%, #0f0f17); }
    .badge { border: 1px solid #2a2a3e; background: #0f0f17; color: #bac2de; }
    .metric-card:hover { border-color: #89b4fa66; transform: translateY(-1px); }
    .input { background:#0f0f17; border:1px solid #2a2a3e; border-radius:8px; padding:8px 12px; color:#cdd6f4; font-size:13px; outline:none; }
    .input:focus { border-color:#89b4fa66; }
    mark { background:#f9e2af33; color:#f9e2af; border-radius:3px; padding:0 2px; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden">
  <header class="w-full max-w-[1800px] mx-auto px-5 2xl:px-6 pt-6 pb-4">
    <div class="flex items-start justify-between gap-6 flex-wrap">
      <div>
        <div id="crumb" class="font-mono text-xs mb-1"></div>
        <h1 class="font-pixel text-accent-green text-lg tracking-wider" id="ws-title">CIE WORKSPACE</h1>
        <p class="font-mono text-sm text-gray-500 mt-2" id="ws-sub">Venture workspace over the card graph</p>
      </div>
      <div class="flex items-center gap-3">
        <input id="global-search" class="input w-64" placeholder="search this view…" autocomplete="off">
        <select id="sort" class="input"></select>
        <div class="rounded-lg border border-surface-border bg-surface-card px-3 py-2 min-w-40">
          <div class="font-mono text-[10px] text-gray-600 uppercase tracking-wider">Graph</div>
          <div id="header-counts" class="font-mono text-xs text-gray-400 mt-1">Loading</div>
        </div>
        <div class="rounded-lg border border-surface-border bg-surface-card px-3 py-2 min-w-28">
          <div class="font-mono text-[10px] text-gray-600 uppercase tracking-wider">Mode</div>
          <div class="font-mono text-xs text-accent-blue mt-1">Read-only</div>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full max-w-[1800px] mx-auto px-5 2xl:px-6 pb-8 grid grid-cols-1 xl:grid-cols-12 gap-5 2xl:gap-6">
    <aside class="xl:col-span-2 min-w-0">
      <div class="sticky top-6 space-y-4">
        <nav id="nav" class="rounded-xl border border-surface-border bg-surface-card p-2 space-y-1.5"></nav>
      </div>
    </aside>
    <section class="xl:col-span-7 min-w-0">
      <div id="view-root" class="animate-fade-in"></div>
    </section>
    <aside class="xl:col-span-3 min-w-0">
      <div class="sticky top-6 space-y-4">
        <section id="detail-panel" class="rounded-xl border border-surface-border bg-surface-card overflow-hidden">
          <div class="p-4 border-b border-surface-border flex items-center justify-between">
            <h2 class="font-pixel text-accent-purple text-[10px] tracking-wider">DETAILS</h2>
            <span id="detail-context" class="font-mono text-[10px] text-gray-600">Workspace</span>
          </div>
          <div id="detail-body" class="p-4 font-mono text-sm text-gray-500">Select a card to inspect it.</div>
        </section>
      </div>
    </aside>
  </main>

  <script src="../static/embedded-bar.js"></script>
  <script src="../static/vendor/d3.v7.min.js"></script>
  <script>
  // ---------- config ----------
  const VIEWS = [
    { key:"about",      label:"About" },
    { key:"overview",   label:"Overview" },
    { key:"cards",      label:"Cards" },
    { key:"meetings",   label:"Meetings",   ctype:"transcript" },
    { key:"decisions",  label:"Decisions",  ctype:"decision" },
    { key:"concepts",   label:"Concepts",   ctype:"concept" },
    { key:"actions",    label:"Actions",    ctype:"action_item" },
    { key:"people",     label:"People" },
    { key:"incidence",  label:"Incidence" },
    { key:"backlog",    label:"Backlog" },
    { key:"milestones", label:"Milestones" },
    { key:"project",    label:"Project" },
    { key:"finance",    label:"Finance" },
    { key:"journal",    label:"Journal" },
    { key:"resources",  label:"Resources" },
  ];
  const GLYPH = { transcript:"🎙", decision:"⚖", concept:"💡", action_item:"✓",
                  task:"☑", journal:"📓", repo:"⌥", doc:"📄", link:"🔗",
                  milestone:"◆", person:"👤", resource:"🔗" };
  const TYPE_COLOR = { transcript:"#89b4fa", decision:"#f9e2af", concept:"#cba6f7",
                       action_item:"#a6e3a1", task:"#a6e3a1", journal:"#94e2d5",
                       repo:"#fab387", doc:"#89dceb", link:"#7f849c", milestone:"#f9e2af",
                       person:"#f5c2e7", resource:"#7f849c" };
  // Provenance trust tiers (Phase 0, task-4101). Coarse, not a fake 0-1 score.
  const TIER = {
    curated:    { label:"✓ curated",    color:"#a6e3a1" },
    inferred:   { label:"~ inferred",   color:"#89b4fa" },
    unverified: { label:"? unverified", color:"#f9e2af" },
  };
  function tierBadge(t){ const x=TIER[t]||TIER.inferred;
    return `<span class="badge rounded-full px-2 py-0.5 font-mono text-[10px]" title="provenance: ${esc(t||'inferred')}" style="border-color:${x.color}55;color:${x.color}">${x.label}</span>`; }
  function provBlock(p){
    if(!p) return '';
    const row=(k,v)=>v?`<div class="flex gap-2"><span class="text-gray-600" style="min-width:84px">${esc(k)}</span><span class="text-gray-300 break-all">${esc(v)}</span></div>`:'';
    const body = row('source', p.source_type) + row('extracted by', p.extracted_by) + row('lens', p.lens)
      + row('extracted at', fmtDate(p.extracted_at)) + row('verified by', p.verified_by||'—');
    if(!body) return '';
    return `<div class="rounded-lg border border-surface-border bg-surface p-3 mb-4 font-mono text-[10px] space-y-0.5">
      <div class="text-accent-purple uppercase tracking-wider mb-1">Provenance</div>${body}</div>`;
  }
  const SORTS = {
    cards: [["created_desc","newest"],["created_asc","oldest"],["title_az","title A→Z"],["xp_desc","xp ↓"]],
    backlog: [["prio","priority"],["due","due date"],["title_az","title A→Z"]],
    people: [["count_desc","most active"],["name_az","name A→Z"]],
    journal: [["created_desc","newest"],["title_az","title A→Z"]],
    resources: [["type","type"],["title_az","title A→Z"]],
    plain: [],
  };
  const state = { view:"overview", q:"", sort:"created_desc", selected:"", counts:{},
                  cardsSub:"cards", cardsType:"all" };

  // ---------- helpers ----------
  function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function attr(s){ return esc(s).replace(/'/g,'&#39;'); }
  function apiPath(p){ return p.replace(/^\//,''); }
  async function api(p){ const r=await fetch(apiPath(p)); if(!r.ok) throw new Error(p+' -> '+r.status); return r.json(); }
  // Mount/venture path helpers — robust to missing trailing slash. From
  // /ventures/<slug> OR /ventures/<slug>/ → base '/ventures/', slug '<slug>'.
  function venturesBase(){ const p=location.pathname.split('/').filter(Boolean); return '/'+(p[0]||'ventures')+'/'; }
  function ventureSlug(){ const p=location.pathname.split('/').filter(Boolean); return p[1]||''; }
  function renderCrumb(name){
    const el=document.getElementById('crumb'); if(!el) return;
    el.innerHTML=`<a href="${esc(venturesBase())}" class="text-accent-blue">← Ventures</a> <span class="text-gray-600">/</span> <span class="text-gray-400">${esc(name||ventureSlug())}</span>`;
  }
  const glyph = t => GLYPH[t]||"▦";
  const tcolor = t => TYPE_COLOR[t]||"#7f849c";
  const prioDot = p => ({critical:'#f38ba8',high:'#fab387',medium:'#89b4fa',low:'#7f849c'}[String(p).toLowerCase()]||'#7f849c');
  const fmtDate = s => { if(!s) return ""; const m=/^(\d{4}-\d{2}-\d{2})/.exec(String(s)); return m?m[1]:String(s).slice(0,10); };
  function highlight(text){ if(!state.q) return esc(text); const q=state.q.trim(); if(!q) return esc(text);
    try{ return esc(text).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }catch(e){ return esc(text); } }
  function sortKind(view){
    if(view==="cards") return state.cardsSub==="cards" ? "cards" : "plain";
    if(["meetings","decisions","concepts","actions"].includes(view)) return "cards";
    return SORTS[view]?view:"plain";
  }
  function applySort(items){ const s=state.sort, by=f=>items.slice().sort(f), t=x=>String(x.title||"").toLowerCase();
    if(s==="created_desc") return by((a,b)=>String(b.created||"").localeCompare(String(a.created||"")));
    if(s==="created_asc")  return by((a,b)=>String(a.created||"").localeCompare(String(b.created||"")));
    if(s==="title_az")     return by((a,b)=>t(a).localeCompare(t(b)));
    if(s==="xp_desc")      return by((a,b)=>(b.xp||0)-(a.xp||0));
    if(s==="name_az")      return by((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
    if(s==="count_desc")   return by((a,b)=>(b.count||0)-(a.count||0));
    if(s==="due")          return by((a,b)=>String(a.due||"9999").localeCompare(String(b.due||"9999")));
    if(s==="type")         return by((a,b)=>String(a.type||"").localeCompare(String(b.type||"")));
    if(s==="prio"){ const r={critical:0,high:1,medium:2,low:3}; return by((a,b)=>(r[String(a.priority).toLowerCase()]??9)-(r[String(b.priority).toLowerCase()]??9)); }
    return items;
  }
  function filterQ(items, fields){ if(!state.q) return items; const q=state.q.toLowerCase();
    return items.filter(it=>fields.some(f=>{ const v=it[f]; if(Array.isArray(v)) return v.join(" ").toLowerCase().includes(q); return String(v||"").toLowerCase().includes(q); })); }

  // ---------- thumbnail tile (cards have no image yet → type glyph tile) ----------
  function thumb(type, cls='w-32 h-[72px]'){
    return `<div class="${cls} rounded thumb flex items-center justify-center" style="color:${tcolor(type)};font-size:1.5rem">${glyph(type)}</div>`;
  }

  // ---------- card row (clone of youtube videoRow) ----------
  function cardRow(it){
    const sel = state.selected===it.slug ? ' selected' : '';
    const tags = (it.tags||[]).slice(0,6).map(t=>`<span class="badge inline-block rounded-full px-2 py-0.5 font-mono text-[10px]">#${esc(t)}</span>`).join('');
    const xp = it.xp!=null ? `<span class="badge inline-block rounded-full px-2 py-0.5 font-mono text-[10px]">L${esc(it.level||'?')} · ${esc(it.xp)}xp</span>` : '';
    const ppl = (it.participants||[]).length ? ` <span class="text-gray-700">/</span> ${esc(it.participants.length)} ppl` : '';
    return `<article class="card-row${sel} p-3 border-b border-surface-border/70 cursor-pointer" data-card="${esc(it.slug)}">
      <div class="flex gap-4">
        <div class="flex-shrink-0">${thumb(it.type)}</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span style="width:8px;height:8px;border-radius:50%;flex:none;background:${prioDot(it.priority)}"></span>
            <span class="badge inline-block rounded-full px-2 py-0.5 font-mono text-[10px]" style="border-color:${tcolor(it.type)}55;color:${tcolor(it.type)}">${esc(it.type)}</span>
            ${tierBadge(it.tier)}
            <span class="font-mono text-[10px] text-gray-600 ml-auto">${esc(fmtDate(it.created))}</span>
          </div>
          <div class="font-mono font-semibold text-sm text-gray-100 line-clamp-2 leading-6 mt-1">${highlight(it.title||it.slug)}</div>
          <div class="font-mono text-[11px] text-gray-500 mt-1 line-clamp-2">${highlight(it.summary||"")}</div>
          <div class="mt-2 flex flex-wrap gap-1.5">${tags}${xp}</div>
        </div>
      </div>
    </article>`;
  }
  function listShell(rowsHtml){
    return `<div class="rounded-xl border border-surface-border bg-surface-card overflow-hidden"><div class="divide-y divide-surface-border/70">${rowsHtml}</div></div>`;
  }
  function emptySlice(msg){ return `<div class="p-6 font-mono text-sm text-gray-600">${esc(msg)}</div>`; }
  function sectionTitle(title, sub=''){
    return `<div class="mb-5 flex items-end justify-between gap-4"><div>
      <h2 class="font-pixel text-accent-green text-sm tracking-wider">${esc(title)}</h2>
      ${sub?`<p class="font-mono text-sm text-gray-500 mt-2 leading-6">${esc(sub)}</p>`:''}</div>
      <span class="font-mono text-[11px] text-gray-600" id="view-count"></span></div>`;
  }
  function setCount(n){ const el=document.getElementById('view-count'); if(el) el.textContent = (n!=null)?`${n} items`:''; }

  // ---------- nav + sort ----------
  function renderNav(){
    const nav=document.getElementById('nav');
    // Backlink to the venture portfolio (relative '../' → /ventures/ in Mode B).
    const back = `<a href="${esc(venturesBase())}" class="nav-tab block w-full text-left rounded-lg border border-transparent px-3 py-2.5 font-mono text-xs text-accent-blue" style="margin-bottom:8px;border-color:#89b4fa33">← All Ventures</a>`;
    nav.innerHTML = back + VIEWS.map(v=>{
      const c=state.counts[v.key]; const cnt=(c==null)?'':`<span class="float-right text-gray-600">${c}</span>`;
      return `<button data-view="${v.key}" class="nav-tab ${state.view===v.key?'active':''} w-full text-left rounded-lg border border-transparent px-3 py-2.5 font-mono text-xs">${esc(v.label)}${cnt}</button>`;
    }).join('');
    nav.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  }
  function renderSort(){
    const sel=document.getElementById('sort'); const opts=SORTS[sortKind(state.view)]||[];
    if(!opts.length){ sel.style.display='none'; return; } sel.style.display='';
    if(!opts.some(o=>o[0]===state.sort)) state.sort=opts[0][0];
    sel.innerHTML=opts.map(([v,l])=>`<option value="${v}" ${state.sort===v?'selected':''}>sort: ${esc(l)}</option>`).join('');
    sel.onchange=()=>{ state.sort=sel.value; render(); };
  }

  // ---------- views ----------
  async function viewCards(ctype, label){
    const root=document.getElementById('view-root');
    let items=(await api('/api/list')).filter(i=>i.type===ctype);
    state.counts[state.view]=items.length; renderNav();
    items=applySort(filterQ(items,["title","summary","tags"]));
    root.innerHTML = sectionTitle(label) + (items.length?listShell(items.map(cardRow).join('')):emptySlice(`No ${label.toLowerCase()} yet.`));
    setCount(items.length);
  }
  async function viewAbout(){
    const root=document.getElementById('view-root');
    const v=await api('/api/venture');
    if(v.error){ root.innerHTML=sectionTitle('ABOUT')+emptySlice(v.error); return; }
    // header title reflects the venture
    if(v.title){ document.getElementById('ws-title').textContent=String(v.title).toUpperCase();
      document.getElementById('ws-sub').textContent=`${v.stage||''}${v.priority?' · '+v.priority:''}`;
      renderCrumb(v.title); }
    const ms=(v.milestones||[]).slice(0,5), dl=(v.deadlines||[]).slice(0,5);
    const links=Object.entries(v.links||{});
    const team=v.co_venturers||[];
    const f=v.financial||{};
    const more=(label,view)=>`<button data-goview="${view}" class="badge rounded-full px-3 py-1 font-mono text-[10px] text-accent-blue" style="border-color:#89b4fa55">${esc(label)} →</button>`;
    const msHtml = ms.length ? ms.map(m=>`<div class="font-mono text-xs flex items-center gap-2 py-0.5"><span style="color:#f9e2af">◆</span><span class="flex-1 ${/(complete|done)/i.test(m.status||'')?'line-through text-gray-600':'text-gray-200'}">${esc(m.title||m.label||'')}</span><span class="text-gray-600">${esc(m.date||m.status||'')}</span></div>`).join('') : '<div class="font-mono text-xs text-gray-600">none</div>';
    const dlHtml = dl.length ? dl.map(d=>`<div class="font-mono text-xs flex items-center gap-2 py-0.5"><span style="color:${d.overdue?'#f38ba8':'#fab387'}">⚑</span><span class="flex-1 text-gray-200">${esc(d.label||d.description||'')}</span><span class="${d.overdue?'text-accent-red':'text-gray-600'}">${esc(d.date||'')}</span></div>`).join('') : '<div class="font-mono text-xs text-gray-600">none</div>';
    const card=(title,extra,body)=>`<section class="rounded-xl border border-surface-border bg-surface-card p-4">
      <div class="flex items-center gap-2 mb-3"><h3 class="font-pixel text-accent-purple text-[10px] tracking-wider">${esc(title)}</h3><span class="ml-auto">${extra||''}</span></div>${body}</section>`;
    root.innerHTML = sectionTitle('ABOUT', 'Curated venture facts — authored, authoritative. The emergent signal lives in the other views.') +
      `<div class="rounded-xl border border-surface-border bg-surface-card p-5 mb-4">
         <div class="font-mono text-sm text-gray-300 leading-6">${esc(v.description||'')}</div>
       </div>
       <div class="grid gap-4" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
         ${card('Milestones', more('all','milestones'), msHtml)}
         ${card('Deadlines', more('all','milestones'), dlHtml)}
         ${card('Financial', more('detail','finance'),
            `<div class="font-mono text-xs space-y-1 text-gray-200">
               <div>revenue to date: <span class="text-accent-green">${esc(f.revenue_to_date??'—')} ${esc(f.currency||'')}</span></div>
               <div>cap / budget: ${esc(f.cap??f.budget??'—')}</div>
               <div>invoices: ${esc((f.invoices||[]).length)}</div></div>`)}
         ${card('Team', null, team.length?team.map(c=>`<div class="font-mono text-xs text-gray-200 py-0.5">${esc(c.name)} <span class="text-gray-600">— ${esc(c.role||'')}</span></div>`).join(''):'<div class="font-mono text-xs text-gray-600">none</div>')}
         ${card('Links & Resources', more('all','resources'),
            links.length?links.map(([k,u])=>`<div class="font-mono text-xs py-0.5">${/^https?:/.test(String(u))?`<a href="${esc(u)}" target="_blank" rel="noopener" class="text-accent-blue break-all">${esc(k)}</a>`:`<span class="text-gray-300">${esc(k)}</span>`}</div>`).join(''):'<div class="font-mono text-xs text-gray-600">none</div>')}
         ${card('Workspace', null,
            `<div class="flex flex-wrap gap-1.5">${['overview','meetings','people','incidence','backlog','journal'].map(vw=>`<button data-goview="${vw}" class="badge rounded-full px-2 py-0.5 font-mono text-[10px] text-accent-blue" style="border-color:#89b4fa44">${vw}</button>`).join('')}</div>`)}
       </div>`;
    setCount(null);
  }
  async function viewOverview(){
    const root=document.getElementById('view-root');
    const s=await api('/api/stats');
    const recent=(await api('/api/list')).slice(0,6);
    const metric=(n,l)=>`<div class="metric-card rounded-xl border border-surface-border bg-surface-card p-4 text-center transition">
      <div class="font-pixel text-accent-purple text-lg">${esc(n)}</div><div class="font-mono text-[10px] text-gray-600 uppercase tracking-wider mt-1">${esc(l)}</div></div>`;
    const chips=Object.entries(s.by_type||{}).map(([t,n])=>`<button data-jump="${esc(t)}" class="badge rounded-full px-3 py-1 font-mono text-xs" style="border-color:${tcolor(t)}55;color:${tcolor(t)}">${glyph(t)} ${esc(t)} · ${esc(n)}</button>`).join(' ');
    root.innerHTML = sectionTitle('OVERVIEW','The card graph + linked venture stores at a glance.') +
      `<div class="grid grid-cols-3 gap-3 mb-5">${metric(s.nodes,'cards')}${metric(s.edges,'links')}${metric(s.people,'people')}</div>
       <h3 class="font-pixel text-accent-blue text-[10px] tracking-wider mb-3">CARDS BY TYPE</h3>
       <div class="flex flex-wrap gap-2 mb-6">${chips}</div>
       <h3 class="font-pixel text-accent-green text-[10px] tracking-wider mb-3">RECENT CARDS</h3>
       ${listShell(recent.map(cardRow).join(''))}`;

  // D3 force graph — mirrors scripts/cards_graph.py styling.
  function drawGraph(nodes, links){
    const svgEl=document.getElementById('graph-svg'); if(!svgEl||!window.d3) return;
    const W=svgEl.clientWidth||900, H=svgEl.clientHeight||640;
    const N=nodes.map(n=>({id:n.slug,type:n.type,title:n.title,xp:n.xp||10,summary:n.summary||''}));
    const L=links.map(l=>({source:l.source,target:l.target,rel:l.rel_type})).filter(l=>N.some(n=>n.id===l.source)&&N.some(n=>n.id===l.target));
    const types=[...new Set(N.map(n=>n.type))];
    const color=t=>tcolor(t);
    const r=d3.scaleSqrt(d3.extent(N,n=>n.xp),[7,26]);
    const svg=d3.select(svgEl); svg.selectAll('*').remove();
    const rootG=svg.append('g');
    svg.call(d3.zoom().scaleExtent([.2,4]).on('zoom',e=>rootG.attr('transform',e.transform)));
    const sim=d3.forceSimulation(N)
      .force('link',d3.forceLink(L).id(d=>d.id).distance(95).strength(.4))
      .force('charge',d3.forceManyBody().strength(-280))
      .force('center',d3.forceCenter(W/2,H/2))
      .force('collide',d3.forceCollide().radius(d=>r(d.xp)+8));
    const link=rootG.append('g').attr('stroke','#2a2a3e').attr('stroke-width',1.2).selectAll('line').data(L).join('line');
    const lt=rootG.append('g').selectAll('text').data(L).join('text').text(d=>d.rel||'').attr('fill','#6e7681').attr('font-size',8).attr('font-family','JetBrains Mono,monospace').attr('pointer-events','none');
    const node=rootG.append('g').selectAll('g').data(N).join('g').style('cursor','pointer')
      .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
        .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
    node.append('circle').attr('r',d=>r(d.xp)).attr('fill',d=>color(d.type)).attr('stroke','#0e1116').attr('stroke-width',1.5)
      .on('click',(e,d)=>openCard(d.id))
      .on('mousemove',(e,d)=>{ const tip=document.getElementById('graph-tip'); tip.style.opacity=1;
        tip.style.left=(e.offsetX+14)+'px'; tip.style.top=(e.offsetY+14)+'px';
        tip.innerHTML=`<b style="color:#fff">${esc(d.title)}</b><div style="color:${color(d.type)}">${esc(d.type)}</div><div class="t" style="color:#8b949e;margin-top:4px">${esc(d.summary)}</div>`; })
      .on('mouseleave',()=>{ document.getElementById('graph-tip').style.opacity=0; });
    node.append('text').text(d=>d.title.length>34?d.title.slice(0,32)+'…':d.title)
      .attr('x',d=>r(d.xp)+5).attr('y',4).attr('fill','#c9d1d9').attr('font-size',11).attr('font-family','JetBrains Mono,monospace').attr('pointer-events','none');
    sim.on('tick',()=>{
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      lt.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
    document.getElementById('graph-legend').innerHTML=types.map(t=>`<span class="badge rounded-full px-2 py-0.5 font-mono text-[10px]" style="color:${color(t)};border-color:${color(t)}55">${glyph(t)} ${esc(t)}</span>`).join('');
  }

      <span class="badge rounded-full px-2 py-0.5 text-[10px]" style="color:#cba6f7;border-color:#cba6f744">${e.direction==='out'?'→':'←'} ${esc(e.rel_type)}</span>
      <a class="text-accent-blue cursor-pointer" data-card="${esc(e.other_id)}">${esc(e.other_title)}</a>
      ${e.summary?`<div class="text-gray-600 ml-1 mt-0.5">${esc(e.summary)}</div>`:''}</div>`).join('');
    const outcomes=(d.key_outcomes||[]).map(o=>`<li>${esc(o)}</li>`).join('');
    setDetail(`
      <div class="flex items-center gap-2 mb-3 flex-wrap">
        <span class="badge rounded-full px-2 py-0.5 font-mono text-[10px]" style="border-color:${tcolor(d.type)}55;color:${tcolor(d.type)}">${glyph(d.type)} ${esc(d.type)}</span>

        <span class="font-mono text-[10px] text-gray-600 ml-auto">${esc(fmtDate(d.created))}${d.xp!=null?` · L${esc(d.level)} · ${esc(d.xp)}xp`:''}</span>
      </div>
      ${provBlock(d.provenance)}
      <div class="font-mono font-semibold text-sm text-gray-100 leading-6 mb-3">${esc(d.title)}</div>
      ${d.project||d.client?`<div class="mb-3 flex flex-wrap gap-1.5">${d.project?`<span class="badge rounded-full px-2 py-0.5 font-mono text-[10px]">${esc(d.project)}</span>`:''}${d.client?`<span class="badge rounded-full px-2 py-0.5 font-mono text-[10px]">${esc(d.client)}</span>`:''}</div>`:''}
      <div class="font-mono text-[13px] text-gray-300 leading-6 mb-4 whitespace-pre-wrap">${esc(d.body||d.description||'')}</div>
      ${outcomes?`<h3 class="font-pixel text-accent-green text-[10px] tracking-wider mb-2">KEY OUTCOMES</h3><ul class="font-mono text-[12px] text-gray-300 list-disc pl-5 mb-4 leading-6">${outcomes}</ul>`:''}
      ${(d.participants||[]).length?`<h3 class="font-pixel text-accent-pink text-[10px] tracking-wider mb-2">PARTICIPANTS</h3><div class="flex flex-wrap gap-1.5 mb-4">${d.participants.map(p=>`<span class="badge rounded-full px-2 py-0.5 font-mono text-[10px]">👤 ${esc(p)}</span>`).join('')}</div>`:''}
      ${edges?`<h3 class="font-pixel text-accent-purple text-[10px] tracking-wider mb-2">INCIDENCE (${(d.edges||[]).length})</h3>${edges}`:''}
      ${(d.tags||[]).length?`<div class="mt-3 flex flex-wrap gap-1.5">${d.tags.map(t=>`<span class="badge rounded-full px-2 py-0.5 font-mono text-[10px]">#${esc(t)}</span>`).join('')}</div>`:''}
      ${(d.sources||[]).length?`<div class="font-mono text-[10px] text-gray-700 mt-4 break-all">src: ${d.sources.map(esc).join('<br>')}</div>`:''}
    `, d.type);
    const row=document.querySelector(`.card-row[data-card="${(window.CSS&&CSS.escape)?CSS.escape(id):id}"]`); if(row) row.classList.add('selected');
  }

  // ---------- router ----------
  const RENDER = { about:viewAbout, overview:viewOverview, cards:viewCardsAll, people:viewPeople, incidence:viewIncidence, backlog:viewBacklog,
                   journal:viewJournal, resources:viewResources, milestones:viewMilestones, project:viewProject, finance:viewFinance };
  function render(){
    renderSort();
    const v=VIEWS.find(x=>x.key===state.view);
    if(v&&v.ctype) return viewCards(v.ctype, v.label);
    return (RENDER[state.view]||viewOverview)();
  }
  function setView(view){
    state.view=VIEWS.some(v=>v.key===view)?view:'about'; state.q=''; document.getElementById('global-search').value='';
    const u=new URL(location); u.searchParams.set('view',state.view); history.replaceState({},'',u);
    renderNav(); render();
  }
  async function renderHealth(){ try{ const s=await api('/api/stats'); document.getElementById('header-counts').textContent=`${s.nodes} cards / ${s.edges} links / ${s.people} ppl`; }catch(e){} }
  // Delegated click handling — no inline onclick string-building (XSS-safe:
  // ids/names/urls live in HTML-escaped data-* attributes, never in JS source
  // strings). One listener covers the list, the graph, and the detail panel.
  function wireDelegation(){
    document.addEventListener('click', e=>{
      const card=e.target.closest('[data-card]'); if(card){ openCard(card.getAttribute('data-card')); return; }
      const person=e.target.closest('[data-person]'); if(person){ openPerson(person.getAttribute('data-person')); return; }
      const res=e.target.closest('[data-url]'); if(res){ const u=res.getAttribute('data-url'); if(u) window.open(u,'_blank','noopener'); return; }
      const gv=e.target.closest('[data-goview]'); if(gv){ setView(gv.getAttribute('data-goview')); return; }
    });
  }
  async function init(){
    // Guarantee a trailing slash so every relative URL (api/*, ../static/*)
    // resolves correctly. /ventures/<slug> → /ventures/<slug>/.
    if(!location.pathname.endsWith('/')){ location.replace(location.pathname+'/'+location.search); return; }
    const params=new URLSearchParams(location.search);
    state.view=VIEWS.some(v=>v.key===params.get('view'))?params.get('view'):'about';
    document.getElementById('global-search').addEventListener('input', e=>{ state.q=e.target.value; render(); });
    wireDelegation();
    renderCrumb();
    renderHealth(); renderNav(); render();
  }
  init();
  </script>
</body>
</html>
